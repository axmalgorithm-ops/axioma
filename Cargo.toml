[package]
name = "axioma"
version = "0.1.0"
edition = "2021"
description = "A zero-allocation, division-free universal compression core"
authors = ["Murad Abbasov"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/axmalgorithm-ops/axioma"
readme = "README.md"
keywords = ["compression", "no_std", "embedded", "lz77"]
categories = ["compression", "no-std"]

[dependencies]

[profile.dev]
overflow-checks = false

[profile.test]
overflow-checks = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
